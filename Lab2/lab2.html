<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Profile Page</title>
</head>
<body>
    <header>
        <h1>Welcome to My Personal Profile</h1>
    </header>
    <nav>
        <a href="#about">About Me</a>

    </nav>
    <section id="about">
        <article>
            <h2>About Me</h2>
            <p>Hello! This is my professional details.</p>
            <table border="1">
                <thead>
                    <tr>
                        <th>Attribute</th>
                        <th>Information</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Name</td>
                        <td>Anis</td>
                        <td>Verified</td>
                    </tr>
                    <tr>
                        <td>Age</td>
                        <td>21</td>
                        <td>Current</td>
                    </tr>
                    <tr>
                        <td>Occupation</td>
                        <td>Web Developer</td>
                        <td>Active</td>
                    </tr>
                </tbody>
            </table>
        </article>
    </section>
    <section id="contact">
        <h2>Connect with Me</h2>
        <form action="#" method="POST">
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" value="Anis" required>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="s80285@gmail.com.my" required>
            </p>
            <p>
                <label>Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                
                <input type="radio" id="female" name="gender" value="female" checked>
                <label for="female">Female</label>
                
                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </p>
            <p>
                <label>Favorite Hobbies:</label><br>
                <input type="checkbox" id="coding" name="hobbies" value="coding">
                <label for="coding">Coding</label>
                
                <input type="checkbox" id="reading" name="hobbies" value="reading" checked>
                <label for="reading">Reading</label>
                
                <input type="checkbox" id="gaming" name="hobbies" value="gaming">
                <label for="gaming">Gaming</label>
                
                <input type="checkbox" id="traveling" name="hobbies" value="traveling">
                <label for="traveling">Traveling</label>
            </p>
            <p>
                <button type="submit">Submit Info</button>
            </p>

    </section>
