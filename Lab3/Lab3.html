<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Exercise 3</title>
</head>
<body>
    <div>
        <h1>TechSolutions Potral</h1>
        <span>Connecting you to innovation every day.</span>
    </div>
    <hr>
    <div>
        <h2>Contact Us</h2>
        <form>
            <p>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="contact-date">Preferred Contact Date:</label>
                <input type="date" id="contact-date" name="contact-date">
            </p>
            <p>
                <label for="satisfaction">Satisfaction Level:</label>
                <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" value="5">
            </p>
            <p>
                <button type="submit">Submit Inquiry</button>
            </p>
        </form>
    </div>
    <div>
        <h2>Inline Calculator</h2>
        <form oninput="sumResult.value = parseFloat(num1.value || 0) + parseFloat(num2.value || 0)">
            <p>
                <label for="num1">Number 1:</label>
                <input type="number" id="num1" name="num1" value="0">
            </p>
            <p>
                <label for="num2">Number 2:</label>
                <input type="number" id="num2" name="num2" value="0">
            </p>
            <p>
                <strong>Total Sum:</strong> 
                <output name="sumResult" for="num1 num2">0</output>
            </p>
        </form>
    </div>
    <hr>
    <div>
        <p>Contact us at support@techsolutions.com | Phone: (555) 019-2834</p>
        <p>&copy; 2026 TechSolutions Inc. All rights reserved.</p>
    </div>

</body>
</html>
